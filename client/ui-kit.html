<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Claude Office UI kit</title>
    <!-- Dev-only living style guide for client/src/ui (docs/UX.md). Not part of the build. -->
    <style>
      html,
      body {
        margin: 0;
        background: #efe5d0;
      }
      .kit {
        max-width: 1400px;
        margin: 0 auto;
        padding: 28px 32px 80px;
        font-family: 'Fredoka', ui-rounded, system-ui, sans-serif;
        color: #2b2d42;
      }
      .kit h1 {
        margin: 0;
        font: 700 40px/44px 'Fredoka', system-ui, sans-serif;
      }
      .kit-lede {
        margin: 6px 0 0;
        max-width: 72ch;
        color: #5c5f77;
        font-size: 16px;
        line-height: 22px;
      }
      .kit-sec {
        margin-top: 40px;
      }
      .kit-sec > h2 {
        margin: 0;
        font: 700 28px/32px 'Fredoka', system-ui, sans-serif;
      }
      .kit-sec > p {
        margin: 4px 0 16px;
        max-width: 80ch;
        color: #5c5f77;
        font-size: 15px;
        line-height: 21px;
      }
      .kit-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 18px 20px;
      }
      .kit-row + .kit-row {
        margin-top: 18px;
      }
      .kit-cols {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(410px, 1fr));
        gap: 28px 24px;
        align-items: start;
      }
      .kit-cell {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .kit-cap {
        color: #5c5f77;
        font: 600 13px/16px 'Fredoka', system-ui, sans-serif;
      }
      .kit-stage {
        position: relative;
        box-sizing: border-box;
        border: 4px solid #2b2d42;
        border-radius: 20px;
        overflow: hidden;
      }
      .kit-floor {
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(0, 0, 0, 0.04)),
          repeating-linear-gradient(90deg, #e8be84 0 118px, #d9a96c 118px 120px, #ddaf73 120px 238px, #d9a96c 238px 240px);
      }
      .kit-wall {
        background: linear-gradient(180deg, #cfefff 0 18%, #fff3de 18% 58%, #8fe0c8 58% 63%, #e8be84 63%);
      }
      .kit-swatches {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
      }
      .kit-swatch {
        box-sizing: border-box;
        min-height: 96px;
        padding: 10px 12px;
        border: 3px solid #2b2d42;
        border-radius: 14px;
        box-shadow: 0 4px 0 rgba(43, 45, 66, 0.25);
        font: 600 14px/18px 'Fredoka', system-ui, sans-serif;
      }
      .kit-swatch small {
        display: block;
        font-weight: 400;
      }
      .kit-type > * {
        margin: 0 0 6px;
      }
      .is-focus {
        box-shadow: 0 0 0 3px #fffdf7, 0 0 0 6px #2b2d42 !important;
      }
    </style>
  </head>
  <body class="co-ui">
    <main id="kit" class="kit"></main>
    <script type="module" src="/src/ui-kit.ts"></script>
  </body>
</html>
