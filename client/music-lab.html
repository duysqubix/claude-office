<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music lab · Claude Office</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 12px;
        font: 16px/1.4 system-ui, sans-serif;
        background: #fdf6ec;
        color: #2b2d42;
      }
      button {
        font: inherit;
        padding: 8px 16px;
        border-radius: 12px;
        border: 2px solid #2b2d42;
        background: #fff;
        cursor: pointer;
      }

  <body>
    <h1>Café music lab</h1>
    <div><button id="day" type="button">Play (day)</button> <button id="night" type="button">Play (evening)</button> <button id="stop" type="button">Stop</button></div>
    <p id="now">Nothing playing.</p>
    <script type="module" src="/src/audio/lab.ts"></script>
  </body>
