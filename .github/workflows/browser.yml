# The ui-check suites in headless Chrome against the demo office: every night, on demand
# (Actions → Browser checks → Run workflow), and on pull requests labelled "release". Not a
# required check: some game suites time their checks by the wall clock and miss them now and
# then on a shared runner, so this one is for looking at, not for blocking a merge.
# It runs on macOS for the GPU. With Linux's software WebGL (SwiftShader, lavapipe) the office
# draws 0.5-1.3 frames a second, the game's capped time step slows everything in it to a crawl,
# and every game suite times out. On Metal here it's 23-31 fps.
name: Browser checks

on:
  schedule:
    - cron: '17 4 * * *' # every night, 04:17 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser checks
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: ui-check suites (headless Chrome on Metal, demo office)
        run: node scripts/ci/ui.mjs
      - name: Keep the screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-check-snaps
          path: snaps/
          retention-days: 7
          if-no-files-found: ignore
